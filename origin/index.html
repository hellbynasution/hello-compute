<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DUNIA DJ TERKEREN</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(45deg, #000000, #1a1a1a);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      color: #00ffe5;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    @keyframes gradient {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    h1 {
      margin-top: 40px;
      font-size: 3em;
      text-shadow: 0 0 20px #00faff, 0 0 30px #ff00ff;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .dj-image {
      width: 300px;
      height: auto;
      margin: 30px auto;
      box-shadow: 0 0 40px #00ffff;
      border-radius: 20px;
      transition: transform 0.3s ease;
    }

    .dj-image:hover {
      transform: scale(1.05);
      box-shadow: 0 0 60px #00ffff, 0 0 40px #ff00ff;
    }

    .btn-dj {
      display: block;
      margin: 30px auto;
      padding: 15px 30px;
      font-size: 20px;
      color: #fff;
      background: #ff00ff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px #ff00ff, 0 0 40px #00faff;
      text-decoration: none;
      transition: transform 0.3s ease;
      width: fit-content;
    }

    .btn-dj:hover {
      transform: scale(1.1);
      background: #00ffff;
      box-shadow: 0 0 30px #00ffff, 0 0 60px #ff00ff;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="container">

</body>
</html>
